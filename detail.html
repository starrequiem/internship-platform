<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>前端开发实习生 - 字节跳动 | 实习通</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 公共顶栏（由 js/components.js 自动加载） -->
<div data-component="header"></div>

<div class="detail-main">

  <div class="breadcrumb">
    <a href="index.html">首页</a> &rsaquo;
    <a href="index.html">实习</a> &rsaquo;
    <span>加载中...</span>
  </div>

  <div class="detail-header">
    <div class="company-row">
      <div class="company-logo-lg" style="background:linear-gradient(135deg,#667eea,#764ba2)">?</div>
      <div class="title-row">
        <h1>加载中...</h1>
        <div class="company-name"></div>
      </div>
      <div class="detail-salary"></div>
    </div>
    <div class="detail-meta"></div>
    <div class="detail-actions"></div>
  </div>

  <div class="detail-section"><h2>职位描述</h2><p></p><ul></ul></div>
  <div class="detail-section"><h2>任职要求</h2><ul></ul></div>
  <div class="detail-section"><h2>技术栈 &amp; 标签</h2><div class="detail-tags"></div></div>
  <div class="detail-section">
    <h2>信息分享者</h2>
    <div class="detail-poster">
      <div class="avatar">?</div>
      <div><div class="name"></div><div class="meta"></div></div>
      <a href="#" style="margin-left:auto;color:#4f46e5;font-size:13px;font-weight:600;text-decoration:none">查看TA的主页 →</a>
    </div>
  </div>

  <div class="section-header" style="margin-top:28px">
    <h2>📋 相关推荐</h2>
    <a href="index.html" style="color:#4f46e5;font-size:13px;text-decoration:none">查看更多 →</a>
  </div>
  <div class="related-cards"></div>

</div>

<script src="js/components.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
/* ===== 详情页动态加载 ===== */
(async function() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) return; // 无id则保留静态演示数据

  try {
    const item = await InternAPI.detail(id);
    if (!item) return;

    // 更新页面标题
    document.title = item.title + ' - ' + item.company + ' | 实习通';

    // 面包屑
    const bc = document.querySelector('.breadcrumb');
    bc.innerHTML = '<a href="index.html">首页</a> &rsaquo; <a href="search.html?job_type='+encodeURIComponent(item.job_type||'')+'">'+escHtml(item.job_type||'岗位')+'</a> &rsaquo; <span>'+escHtml(item.title)+'</span>';

    // 头部信息
    const header = document.querySelector('.detail-header');
    const logoChar = (item.company||'?').charAt(0);
    const colors = ['linear-gradient(135deg,#667eea,#764ba2)','linear-gradient(135deg,#f093fb,#f5576c)','linear-gradient(135deg,#4facfe,#00f2fe)','linear-gradient(135deg,#43e97b,#38f9d7)','linear-gradient(135deg,#fa709a,#fee140)'];
    const bg = colors[item.id % colors.length];
    const salary = item.salary_min ? '¥'+item.salary_min+'-'+item.salary_max+'/天' : '薪资面议';
    const deadline = item.deadline ? new Date(item.deadline).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'}) : '长期有效';

    header.innerHTML = `
      <div class="company-row">
        <div class="company-logo-lg" style="background:${bg}">${logoChar}</div>
        <div class="title-row">
          <h1>${escHtml(item.title)}</h1>
          <div class="company-name">${escHtml(item.company)} · ${escHtml(item.city)}${item.district ? escHtml(item.district) : ''}</div>
        </div>
        <div class="detail-salary">${salary}</div>
      </div>
      <div class="detail-meta">
        <div class="detail-meta-item"><span class="label">📍 工作地点</span><span class="value">${escHtml(item.city)}${item.district ? '·'+escHtml(item.district) : ''}</span></div>
        <div class="detail-meta-item"><span class="label">📅 投递截止</span><span class="value">${deadline}</span></div>
        <div class="detail-meta-item"><span class="label">👥 招聘人数</span><span class="value">${item.headcount||1}人</span></div>
        <div class="detail-meta-item"><span class="label">🎓 学历要求</span><span class="value">${escHtml(item.education||'本科及以上')}</span></div>
        <div class="detail-meta-item"><span class="label">⏰ 工作时间</span><span class="value">${item.days_per_week||4}天/周 · ${item.duration_months||3}个月</span></div>
        <div class="detail-meta-item"><span class="label">💼 面向年级</span><span class="value">${escHtml(item.target_grade||'不限')}</span></div>
      </div>
      <div class="detail-section" style="margin-top:16px">
        <h2>📬 联系信息</h2>
        <div style="font-size:14px;line-height:1.8;color:#374151;white-space:pre-wrap">${item.contact_info ? escHtml(item.contact_info) : '发布者未提供联系信息'}</div>
      </div>
      <div class="detail-actions">
        <button class="btn-save" id="btnFav" onclick="toggleFav(${item.id})" style="display:inline-flex;align-items:center;justify-content:center">⭐ 收藏</button>
        <button class="btn-save" id="btnReport" onclick="showReportModal(${item.id})" style="display:inline-flex;align-items:center;justify-content:center;background:#fef2f2;border-color:#ef4444;color:#dc2626;margin-left:auto">🚩 反馈/举报</button>
      </div>`;

    // 职位描述
    const sections = document.querySelectorAll('.detail-section');
    if (sections[0]) {
      if (item.description) {
        sections[0].querySelector('p').textContent = item.description.split('\n')[0] || item.description;
        const ul = sections[0].querySelector('ul');
        const bulletLines = item.description.split('\n').filter(l => l.trim().startsWith('•'));
        if (ul && bulletLines.length) {
          ul.innerHTML = bulletLines.map(l => '<li>'+escHtml(l.replace('•','').trim())+'</li>').join('');
        } else if (ul) {
          // 展示描述中非首行的内容
          const rest = item.description.split('\n').slice(1).filter(l => l.trim()).map(l => '<li>'+escHtml(l.trim())+'</li>').join('');
          ul.innerHTML = rest || '';
        }
      } else {
        sections[0].style.display = 'none';
      }
    }
    // 任职要求
    if (sections[1]) {
      if (item.requirements) {
        const ul = sections[1].querySelector('ul');
        if (ul) {
          const lines = item.requirements.split('\n').filter(l => l.trim());
          ul.innerHTML = lines.map(l => '<li>'+escHtml(l.trim())+'</li>').join('');
        }
      } else {
        sections[1].style.display = 'none';
      }
    }
    // 标签
    if (item.tags && item.tags.length) {
      const tagSection = document.querySelector('.detail-tags');
      if (tagSection) {
        tagSection.innerHTML = item.tags.map(t => '<span class="card-tag">'+escHtml(t)+'</span>').join('');
      }
    } else {
      const tagSection = document.querySelector('.detail-section:nth-of-type(3)');
      if (tagSection) tagSection.style.display = 'none';
    }
    // 分享者
    const posterSection = document.querySelector('.detail-poster');
    if (posterSection && item.username) {
      posterSection.querySelector('.avatar').textContent = item.username.charAt(0);
      posterSection.querySelector('.name').innerHTML = escHtml(item.username) +
        (item.school ? '（'+escHtml(item.school)+' · '+escHtml(item.major||'')+'）' : '');
      posterSection.querySelector('.meta').textContent = '已分享多条实习信息 · 发布于 ' + new Date(item.created_at).toLocaleDateString('zh-CN');
      const link = posterSection.querySelector('a');
      if (link) link.href = 'profile.html?id=' + item.poster_id;
    }
    // 相关推荐-加载更多同类
    try {
      const related = await InternAPI.list({ job_type: item.job_type, limit: 2 });
      if (related.data && related.data.length) {
        const relatedGrid = document.querySelector('.related-cards');
        if (relatedGrid) {
          relatedGrid.innerHTML = related.data
            .filter(r => r.id !== item.id)
            .slice(0, 2)
            .map(r => createMiniCard(r)).join('');
        }
      }
    } catch(_) {}

    // 检查收藏状态
    checkFavState(item.id);

  } catch (_) {
    console.log('后端未连接，显示静态演示数据');
  }
})();

function createMiniCard(item) {
  const colors = ['linear-gradient(135deg,#667eea,#764ba2)','linear-gradient(135deg,#f093fb,#f5576c)','linear-gradient(135deg,#4facfe,#00f2fe)','linear-gradient(135deg,#43e97b,#38f9d7)','linear-gradient(135deg,#fa709a,#fee140)'];
  const bg = colors[item.id % colors.length];
  const salary = item.salary_min ? '¥'+item.salary_min+'-'+item.salary_max+'/天' : '薪资面议';
  return '<div class="card" onclick="location.href=\'detail.html?id='+item.id+'\'">'+
    '<div class="card-top">'+
      '<div class="company-logo" style="background:'+bg+'">'+escHtml(item.company?.charAt(0)||'?')+'</div>'+
      '<div class="card-info"><div class="card-title">'+escHtml(item.title)+'</div><div class="card-company">'+escHtml(item.company)+' · '+escHtml(item.city)+'</div></div>'+
      '<div class="salary">'+salary+'</div>'+
    '</div>'+
    '<div class="card-meta"><span>📍 '+escHtml(item.city)+'</span><span>🎓 '+escHtml(item.education||'本科')+'</span><span>⏰ '+(item.days_per_week||4)+'天/周</span></div>'+
    (item.tags ? '<div class="card-tags">'+item.tags.map(t=>'<span class="card-tag">'+escHtml(t)+'</span>').join('')+'</div>' : '')+
    '</div>';
}

async function checkFavState(internId) {
  var user = Auth.getUser();
  if (!user) return;
  var res = await FavAPI.check(internId);
  var btn = document.getElementById('btnFav');
  if (btn && res.favorited) {
    btn.textContent = '⭐ 已收藏';
    btn.style.background = '#eef2ff';
  }
}

async function toggleFav(internId) {
  try {
    var user = Auth.getUser();
    if (!user) { alert('请先登录'); location.href = 'login.html?redirect='+encodeURIComponent(location.href); return; }
    var btn = document.getElementById('btnFav');
    if (!btn) { console.error('btnFav not found'); return; }
    btn.textContent = '...'; btn.disabled = true;
    var res = await FavAPI.check(internId);
    if (res.favorited) {
      await FavAPI.remove(internId);
      btn.textContent = '⭐ 收藏';
      btn.style.background = '';
    } else {
      await FavAPI.add(internId);
      btn.textContent = '⭐ 已收藏';
      btn.style.background = '#eef2ff';
    }
  } catch(e) { alert('操作失败：' + e.message); }
  finally { var b = document.getElementById('btnFav'); if (b) b.disabled = false; }
}

/* ---- 反馈/举报弹窗 ---- */
var _reportBuilt = false;
function buildReportModal() {
  if (_reportBuilt) return;
  var m = document.createElement('div');
  m.id = 'reportModal';
  m.className = 'report-modal-overlay';
  m.onclick = function(e) { if (e.target === m) closeReportModal(); };
  m.innerHTML = '<div class="report-modal">' +
    '<h3>🚩 反馈问题</h3>' +
    '<p style="font-size:13px;color:#6b7280;margin-bottom:16px">如果发现该实习信息有误、重复或其他问题，请告诉我们</p>' +
    '<input type="hidden" id="reportInternId">' +
    '<div style="margin-bottom:12px"><label style="font-size:13px;font-weight:600;color:#374151">问题类型</label>' +
    '<select id="reportType" style="width:100%;padding:10px 14px;border:1px solid #e5e7eb;border-radius:10px;font-size:14px;margin-top:4px">' +
    '<option value="duplicate">重复信息</option><option value="error">信息有误</option><option value="outdated">已过时/已关闭</option><option value="other">其他问题</option></select></div>' +
    '<div style="margin-bottom:16px"><label style="font-size:13px;font-weight:600;color:#374151">详细说明</label>' +
    '<textarea id="reportMsg" maxlength="500" style="width:100%;padding:10px 14px;border:1px solid #e5e7eb;border-radius:10px;font-size:14px;resize:vertical;min-height:100px;margin-top:4px"></textarea></div>' +
    '<div style="display:flex;gap:10px;justify-content:flex-end">' +
    '<button onclick="closeReportModal()" style="padding:10px 24px;background:#fff;color:#6b7280;border:1px solid #e5e7eb;border-radius:10px;cursor:pointer">取消</button>' +
    '<button onclick="submitReport()" style="padding:10px 24px;background:#dc2626;color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer">提交反馈</button></div></div>';
  document.body.appendChild(m);
  _reportBuilt = true;
}
function showReportModal(internId) {
  if (!Auth.isLoggedIn()) { alert('请先登录'); return; }
  buildReportModal();
  document.getElementById('reportInternId').value = internId;
  document.getElementById('reportModal').style.display = 'flex';
}
function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }
async function submitReport() {
  var msg = document.getElementById('reportMsg').value.trim();
  if (!msg) { alert('请填写详细说明'); return; }
  try {
    var resp = await fetch(API_BASE + '/reports', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + Auth.getToken() },
      body: JSON.stringify({ internship_id: parseInt(document.getElementById('reportInternId').value), type: document.getElementById('reportType').value, message: msg })
    });
    var data = await resp.json();
    if (!resp.ok) throw new Error(data.error);
    alert('✅ ' + data.message);
    closeReportModal();
  } catch(e) { alert('提交失败：' + e.message); }
}

function escHtml(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
