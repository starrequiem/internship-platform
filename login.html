<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 | 实习通</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* ===== 登录页专属样式 ===== */
  .auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(135deg, #eef2ff 0%, #faf5ff 50%, #f0f9ff 100%);
  }
  .auth-card {
    background: #fff;
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 24px rgba(0,0,0,.06), 0 20px 60px rgba(79,70,229,.08);
  }
  .auth-logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .auth-logo a {
    font-size: 28px;
    font-weight: 800;
    color: #4f46e5;
    text-decoration: none;
    letter-spacing: -.5px;
  }
  .auth-logo a span { color: #f59e0b; }
  .auth-title {
    font-size: 22px;
    font-weight: 700;
    color: #1f2937;
    text-align: center;
    margin-bottom: 8px;
  }
  .auth-subtitle {
    font-size: 14px;
    color: #9ca3af;
    text-align: center;
    margin-bottom: 32px;
  }
  .auth-form .form-group {
    margin-bottom: 20px;
  }
  .auth-form .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }
  .auth-form .form-group input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: all .25s;
    background: #f9fafb;
  }
  .auth-form .form-group input:hover { border-color: #d1d5db; }
  .auth-form .form-group input:focus {
    border-color: #4f46e5;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(79,70,229,.08);
  }
  .auth-form .form-group input::placeholder { color: #d1d5db; }
  .auth-form .forgot-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    font-size: 13px;
  }
  .auth-form .forgot-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #6b7280;
    cursor: pointer;
    font-weight: 400;
  }
  .auth-form .forgot-row a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: 500;
  }
  .auth-form .forgot-row a:hover { text-decoration: underline; }
  .btn-auth {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all .25s;
    font-family: inherit;
    box-shadow: 0 4px 16px rgba(79,70,229,.25);
  }
  .btn-auth:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(79,70,229,.35);
  }
  .auth-switch {
    text-align: center;
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid #f3f4f6;
    font-size: 14px;
    color: #6b7280;
  }
  .auth-switch a {
    color: #4f46e5;
    font-weight: 600;
    text-decoration: none;
  }
  .auth-switch a:hover { text-decoration: underline; }
  .auth-error {
    background: #fef2f2;
    color: #dc2626;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .auth-error.show { display: block; }

  .auth-decor {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .15;
    pointer-events: none;
    z-index: 0;
  }
  .auth-decor.d1 { width: 300px; height: 300px; background: #4f46e5; top: -80px; right: -60px; }
  .auth-decor.d2 { width: 250px; height: 250px; background: #f59e0b; bottom: -60px; left: -60px; }
  @media (max-width:480px) {
    .auth-card { padding: 32px 24px; border-radius: 16px; }
    .auth-title { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="auth-decor d1"></div>
<div class="auth-decor d2"></div>

<div class="auth-page">
  <div class="auth-card" style="position:relative;z-index:1">

    <div class="auth-logo">
      <a href="index.html">实习<span>通</span></a>
    </div>
    <h1 class="auth-title">👋 欢迎回来</h1>
    <p class="auth-subtitle">登录你的账号，继续使用实习通</p>

    <div class="auth-error" id="authError">用户名或密码错误</div>

    <form class="auth-form" id="loginForm" onsubmit="return false;">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
      </div>

      <div class="forgot-row">
        <label><input type="checkbox"> 记住我</label>
        <a href="forgot-password.html">忘记密码？</a>
      </div>

      <button type="submit" class="btn-auth" onclick="handleLogin()">🔑 登录</button>
    </form>

    <div class="auth-switch">
      还没有账号？<a href="register.html">立即注册 →</a>
    </div>

  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
// 演示账号（后端不可用时使用）
var DEMO_USERS = {
  'admin':  { id:1, username:'admin',  email:'admin@shixitong.cn',     school:'实习通官方', major:'--', grade:'--', role:'admin',   is_member:1, email_verified:1 },
  '张三':   { id:2, username:'张三',   email:'zhangsan@tsinghua.edu.cn', school:'清华大学',   major:'计算机科学与技术', grade:'2026届', role:'student', is_member:1, email_verified:1 },
  '王同学': { id:3, username:'王同学', email:'wang@zju.edu.cn',         school:'浙江大学',     major:'产品设计',       grade:'2026届', role:'student', is_member:0, email_verified:0 },
  '陈学长': { id:4, username:'陈学长', email:'chen@hust.edu.cn',        school:'华中科技大学', major:'计算机科学',     grade:'2026届', role:'student', is_member:0, email_verified:0 },
  '刘学姐': { id:5, username:'刘学姐', email:null,                      school:'上海交通大学', major:'数据科学',       grade:'2026届', role:'student', is_member:0, email_verified:0 },
};
var DEMO_PASSWORDS = { 'admin': 'admin123', '张三': '123456', '王同学': '123456', '陈学长': '123456', '刘学姐': '123456' };

async function handleLogin() {
  var u = document.getElementById('username').value.trim();
  var p = document.getElementById('password').value.trim();
  if (!u || !p) {
    showError('请填写用户名和密码');
    return;
  }
  var btn = document.querySelector('.btn-auth');
  btn.textContent = '登录中...';
  btn.disabled = true;

  // 先尝试真实 API 登录
  try {
    await Auth.login(u, p);
    redirectAfterLogin();
    return;
  } catch(e) {
    // API 不可用，尝试演示模式
    var demoUser = DEMO_USERS[u];
    if (demoUser && DEMO_PASSWORDS[u] === p) {
      Auth.setToken('demo-token-' + u + '-' + Date.now());
      Auth.setUser(demoUser);
      Auth.updateUI();
      redirectAfterLogin();
      return;
    }
    showError('登录失败：' + (e.message || '用户名或密码错误'));
    btn.textContent = '🔑 登录';
    btn.disabled = false;
  }
}

function redirectAfterLogin() {
  var params = new URLSearchParams(location.search);
  var redirect = params.get('redirect') || 'index.html';
  location.href = redirect;
}

function showError(msg) {
  var el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 3000);
}
// 回车提交
document.getElementById('password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleLogin();
});
</script>

</body>
</html>
