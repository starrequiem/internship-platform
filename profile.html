<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页 | 实习通</title>
<link rel="stylesheet" href="css/style.css">
<style>
</style>
</head>
<body>

<!-- 公共顶栏 -->
<div data-component="header"></div>

<div class="profile-main">

  <!-- 个人信息卡片 -->
  <div class="profile-header" id="profileHeader">
    <div class="profile-avatar" id="profileAvatar">?</div>
    <div class="profile-info">
      <h1 id="profileName">加载中...</h1>
      <div class="school" id="profileSchool"></div>
      <div class="bio" id="profileBio"></div>
      <div class="profile-stats" style="margin-top:12px">
        <div class="profile-stat"><div class="num" id="statShare">0</div><div class="lbl">分享岗位</div></div>
        <div class="profile-stat"><div class="num" id="statHelp">0</div><div class="lbl">帮助同学</div></div>
        <div class="profile-stat"><div class="num" id="statThanks">0</div><div class="lbl">收到感谢</div></div>
      </div>
      <div style="margin-top:12px">
        <a href="edit.html" style="font-size:12px;color:#4f46e5;text-decoration:none;font-weight:500">✏️ 编辑资料</a>
      </div>
    </div>
    <button class="btn-edit-profile" onclick="location.href='edit.html'">✏️ 编辑资料</button>
  </div>

  <!-- Tab -->
  <div class="profile-tabs" id="profileTabs">
    <button class="profile-tab active" data-tab="shared">📋 TA分享的实习</button>
    <button class="profile-tab" data-tab="favs">⭐ TA收藏的</button>
  </div>

  <!-- 内容区 -->
  <div class="profile-card-grid" id="profileGrid"></div>

</div>

<script src="js/components.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
/* ===== 用户页动态加载 ===== */
var urlParams = new URLSearchParams(location.search);
var currentUserId = urlParams.get('id');

(async function init() {
  if (!currentUserId) {
    var user = Auth.getUser();
    currentUserId = user ? user.id : '1';
  }
  await loadUserProfile(currentUserId);
  await loadInternships(currentUserId);
  checkOwnProfile();

  // Tab 切换
  document.querySelectorAll('#profileTabs .profile-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('#profileTabs .profile-tab').forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');
      var tabName = this.dataset.tab;
      if (tabName === 'favs') loadFavorites(currentUserId);
      else loadInternships(currentUserId);
    });
  });
})();

async function loadUserProfile(uid) {
  try {
    const user = await UserAPI.profile(uid);
    document.title = user.username + '的个人主页 | 实习通';
    document.getElementById('profileAvatar').textContent = (user.username||'?').charAt(0);
    document.getElementById('profileName').textContent = user.username || '未知用户';
    document.getElementById('profileSchool').innerHTML =
      (user.school ? '🎓 ' + escHtml(user.school) : '') +
      (user.major ? ' · ' + escHtml(user.major) : '') +
      (user.grade ? ' · ' + escHtml(user.grade) : '');
    document.getElementById('profileBio').textContent = user.bio || '';
    document.getElementById('statShare').textContent = user.share_count || 0;
    document.getElementById('statHelp').textContent = user.thanks_count ? Math.floor(user.thanks_count * 27) : 0;
    document.getElementById('statThanks').textContent = user.thanks_count || 0;
  } catch(e) {
    // 保留静态演示数据
  }
}

async function loadInternships(uid) {
  var grid = document.getElementById('profileGrid');
  var data = await UserAPI.internships(uid);
  if (!data || !data.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><p>还没有分享过实习信息</p></div>';
    return;
  }
  grid.innerHTML = data.map(function(item) { return createProfileCard(item); }).join('');
}

async function loadFavorites(uid) {
  var grid = document.getElementById('profileGrid');
  var data = await UserAPI.favorites(uid);
  if (!data || !data.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">⭐</div><p>还没有收藏过实习信息</p></div>';
    return;
  }
  grid.innerHTML = data.map(function(item) { return createProfileCard(item); }).join('');
}

function createProfileCard(item) {
  var colors = ['linear-gradient(135deg,#667eea,#764ba2)','linear-gradient(135deg,#f093fb,#f5576c)','linear-gradient(135deg,#4facfe,#00f2fe)','linear-gradient(135deg,#43e97b,#38f9d7)','linear-gradient(135deg,#fa709a,#fee140)','linear-gradient(135deg,#a18cd1,#fbc2eb)'];
  var bg = colors[item.id % colors.length];
  var salary = item.salary_min ? '¥'+item.salary_min+'-'+item.salary_max+'/天' : '薪资面议';
  var deadline = item.deadline ? new Date(item.deadline).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'}) : '长期';
  return '<div class="card" onclick="location.href=\'detail.html?id='+item.id+'\'" style="cursor:pointer">'+
    '<div class="card-top">'+
      '<div class="company-logo" style="background:'+bg+'">'+escHtml(item.company?item.company.charAt(0):'?')+'</div>'+
      '<div class="card-info">'+
        '<div class="card-title">'+escHtml(item.title)+'</div>'+
        '<div class="card-company">'+escHtml(item.company)+' · '+escHtml(item.city)+'</div>'+
      '</div>'+
      '<div class="salary">'+salary+'</div>'+
    '</div>'+
    '<div class="card-meta">'+
      '<span>📍 '+escHtml(item.city)+'</span>'+
      '<span>📅 截止 '+deadline+'</span>'+
      '<span>🎓 '+escHtml(item.education||'本科及以上')+'</span>'+
      '<span>⏰ '+(item.days_per_week||4)+'天/周</span>'+
    '</div>'+
    '<div class="card-bottom">'+
      '<span>'+(item.view_count||0)+'人已查看</span>'+
      '<a href="detail.html?id='+item.id+'" class="card-detail-link" onclick="event.stopPropagation()">查看详情 →</a>'+
    '</div>'+
    '</div>';
}

function checkOwnProfile() {
  var user = Auth.getUser();
  if (!user || String(user.id) !== String(currentUserId)) {
    var editBtn = document.querySelector('.btn-edit-profile');
    if (editBtn) editBtn.style.display = 'none';
  }
}

function timeAgo(date) {
  var now = new Date(), diff = now - date;
  var mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + '分钟前';
  var hours = Math.floor(mins / 60);
  if (hours < 24) return hours + '小时前';
  var days = Math.floor(hours / 24);
  if (days < 30) return days + '天前';
  if (days < 365) return Math.floor(days / 30) + '个月前';
  return Math.floor(days / 365) + '年前';
}

function escHtml(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
