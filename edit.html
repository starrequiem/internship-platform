<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信息修改 | 实习通</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .edit-main { max-width: 900px; margin: 0 auto; padding: 24px; }

  /* 页面标题 */
  .edit-page-title { font-size: 22px; font-weight: 700; color: #1f2937; margin-bottom: 8px; }
  .edit-page-sub { font-size: 13px; color: #9ca3af; margin-bottom: 24px; }

  /* Tab 切换 */
  .edit-tabs { display: flex; gap: 0; margin-bottom: 24px; background: #fff; border-radius: 14px; overflow: hidden; }
  .edit-tab { flex: 1; padding: 16px 0; font-size: 15px; font-weight: 600; cursor: pointer; color: #6b7280; border: none; background: transparent; transition: all .2s; text-align: center; }
  .edit-tab:hover { color: #4f46e5; background: #fafaff; }
  .edit-tab.active { color: #4f46e5; box-shadow: inset 0 -3px 0 #4f46e5; }

  /* 区块 */
  .edit-section { background: #fff; border-radius: 16px; padding: 28px; margin-bottom: 20px; display: none; }
  .edit-section.active { display: block; }
  .edit-section h3 { font-size: 16px; font-weight: 600; color: #374151; margin-bottom: 20px; padding-left: 12px; border-left: 3px solid #4f46e5; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .form-row.single { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 13px; font-weight: 600; color: #374151; }
  .form-group input, .form-group select, .form-group textarea {
    padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 10px;
    font-size: 14px; font-family: inherit; outline: none; transition: border .2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.08);
  }
  .form-group textarea { resize: vertical; min-height: 90px; }
  .btn-save {
    padding: 12px 32px; background: linear-gradient(135deg,#4f46e5,#7c3aed); color: #fff;
    border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: all .2s; font-family: inherit;
  }
  .btn-save:hover { opacity: .9; transform: translateY(-1px); }
  .btn-save:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* 我的发布列表 */
  .my-internship-card {
    background: #fafbfc; border: 1px solid #e5e7eb; border-radius: 14px; padding: 20px;
    margin-bottom: 14px; transition: all .2s;
  }
  .my-internship-card:hover { border-color: #c7d2fe; }
  .my-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .my-card-title { font-size: 16px; font-weight: 700; color: #1f2937; }
  .my-card-company { font-size: 13px; color: #6b7280; }
  .my-card-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #9ca3af; margin-bottom: 10px; }
  .my-card-meta span { display: flex; align-items: center; gap: 3px; }
  .my-card-actions { display: flex; gap: 8px; }
  .btn-sm { padding: 6px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; transition: all .2s; }
  .btn-edit { background: #eef2ff; color: #4f46e5; }
  .btn-edit:hover { background: #ddd6fe; }
  .btn-close-intern { background: #fef2f2; color: #dc2626; }
  .btn-close-intern:hover { background: #fecaca; }

  /* 编辑表单（内联展开） */
  .inline-edit-form {
    margin-top: 16px; padding-top: 16px; border-top: 1px solid #e5e7eb; display: none;
  }
  .inline-edit-form.show { display: block; }
  .inline-edit-form .form-row { margin-bottom: 12px; }
  .inline-edit-form .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .btn-cancel { padding: 10px 24px; background: #fff; color: #6b7280; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .btn-cancel:hover { background: #f9fafb; }

  /* 修改时间标签 */
  .modified-badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px;
    background: #fef3c7; color: #92400e; border-radius: 6px; font-size: 11px; font-weight: 600;
  }

  /* 状态标签 */
  .status-badge {
    padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
  }
  .status-active { background: #d1fae5; color: #065f46; }
  .status-closed { background: #f3f4f6; color: #6b7280; }

  /* 成员状态卡片 */
  .member-status-card {
    background: linear-gradient(135deg,#eef2ff,#faf5ff); border: 1px solid #e0e7ff;
    border-radius: 14px; padding: 20px 24px; margin-bottom: 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .member-status-card .status-info h4 { font-size: 15px; font-weight: 700; color: #1f2937; margin-bottom: 4px; }
  .member-status-card .status-info p { font-size: 13px; color: #6b7280; }
  .member-badge {
    padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 700;
  }
  .member-badge.is-member { background: #4f46e5; color: #fff; }
  .member-badge.not-member { background: #f3f4f6; color: #6b7280; }
  .btn-bind-email {
    padding: 10px 20px; background: #fff; color: #4f46e5; border: 2px solid #4f46e5;
    border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    text-decoration: none; transition: all .2s; white-space: nowrap;
  }
  .btn-bind-email:hover { background: #eef2ff; }

  .loading-text { text-align: center; padding: 40px; color: #9ca3af; font-size: 14px; }
  .empty-text { text-align: center; padding: 60px 20px; color: #9ca3af; }
  .empty-text .icon { font-size: 48px; margin-bottom: 12px; }
  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 999;
    padding: 12px 28px; border-radius: 10px; font-size: 14px; font-weight: 600;
    animation: toastIn .3s ease; box-shadow: 0 8px 30px rgba(0,0,0,.15); }
  .toast.success { background: #065f46; color: #fff; }
  .toast.error { background: #dc2626; color: #fff; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  @media (max-width:768px) {
    .form-row { grid-template-columns: 1fr; }
    .member-status-card { flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>

<div data-component="header"></div>

<div class="edit-main">

  <h1 class="edit-page-title">⚙️ 信息修改</h1>
  <p class="edit-page-sub">管理你的个人资料和已发布的实习信息</p>

  <!-- 会员状态卡片 -->
  <div class="member-status-card" id="memberStatusCard">
    <div class="status-info">
      <h4 id="memberStatusTitle">账号状态</h4>
      <p id="memberStatusDesc">加载中...</p>
    </div>
    <div id="memberStatusAction"></div>
  </div>

  <!-- Tab 切换 -->
  <div class="edit-tabs">
    <button class="edit-tab active" data-tab="profile">👤 个人资料</button>
    <button class="edit-tab" data-tab="internships">📋 我的发布</button>
  </div>

  <!-- ===== Tab 1: 个人资料 ===== -->
  <div class="edit-section active" id="section-profile">
    <h3>修改个人资料</h3>
    <form id="profileForm" onsubmit="return false;">
      <div class="form-row single">
        <div class="form-group">
          <label>头像</label>
          <div style="display:flex;align-items:center;gap:12px">
            <div id="avatarPreview" style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;overflow:hidden;flex-shrink:0">👤</div>
            <label style="padding:8px 16px;background:#fff;color:#4f46e5;border:1px solid #4f46e5;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit">
              📷 上传头像
              <input type="file" accept="image/*" id="avatarFile" style="display:none" onchange="previewAvatar(this)">
            </label>
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>学校</label>
          <input type="text" id="editSchool" placeholder="例如：清华大学">
        </div>
        <div class="form-group">
          <label>专业</label>
          <select id="editMajor">
            <option value="">请选择</option>
            <option>计算机/软件</option><option>电子信息/通信</option>
            <option>人工智能/大数据</option><option>数学/统计</option>
            <option>经管/金融</option><option>市场营销/广告</option>
            <option>设计/传媒</option><option>机械/自动化</option>
            <option>外语/国际贸易</option><option>法学</option><option>其他</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>毕业届数</label>
          <select id="editGrade">
            <option value="">请选择</option>
            <option>2026届</option><option>2027届</option><option>2028届</option>
            <option>2029届</option><option>2030届</option>
          </select>
        </div>
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="editEmail" placeholder="your@school.edu.cn">
        </div>
      </div>
      <div class="form-row single">
        <div class="form-group">
          <label>个人简介</label>
          <textarea id="editBio" placeholder="简单介绍一下自己，帮助大家认识你..." maxlength="500"></textarea>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap">
        <button type="submit" class="btn-save" onclick="saveProfile()">💾 保存资料</button>
        <a href="bind-email.html" style="font-size:13px;color:#f59e0b;text-decoration:none;font-weight:500">📧 绑定邮箱</a>
        <a href="forgot-password.html" style="font-size:13px;color:#6b7280;text-decoration:none;font-weight:500">🔑 修改密码</a>
      </div>
    </form>
  </div>

  <!-- ===== Tab 2: 我的发布 ===== -->
  <div class="edit-section" id="section-internships">
    <h3>我发布的实习</h3>
    <div id="myInternshipsList"><div class="loading-text">加载中...</div></div>
  </div>

</div>

<script src="js/components.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
let myInternshipsData = [];

(async function init() {
  if (!Auth.isLoggedIn()) {
    location.href = 'login.html?redirect=edit.html';
    return;
  }

  // Tab 切换
  document.querySelectorAll('.edit-tab').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.edit-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.edit-section').forEach(s => s.classList.remove('active'));
      this.classList.add('active');
      document.getElementById('section-' + this.dataset.tab).classList.add('active');
    });
  });

  await Promise.all([loadMemberStatus(), loadProfileForm(), loadMyInternships()]);
})();

/* ---- 会员状态 ---- */
async function loadMemberStatus() {
  try {
    const user = await UserAPI.me();
    if (user.role === 'admin') {
      document.getElementById('memberStatusTitle').textContent = '🛡️ 管理员账号';
      document.getElementById('memberStatusDesc').textContent = '拥有全部权限，无需绑定邮箱';
      document.getElementById('memberStatusAction').innerHTML = '<span class="member-badge is-member" style="background:#dc2626">🛡️ 管理员</span>';
      return;
    }
    const isMember = user.is_member === 1;
    document.getElementById('memberStatusTitle').textContent = isMember ? '✨ 会员账号' : '📋 普通账号';
    document.getElementById('memberStatusDesc').textContent = isMember
      ? '已绑定邮箱，可发布实习信息、发送感谢评论'
      : '绑定邮箱后即可升级为会员，解锁发布和评论功能';
    document.getElementById('memberStatusAction').innerHTML = isMember
      ? '<span class="member-badge is-member">✅ 已绑定邮箱 · 会员</span>'
      : '<a href="bind-email.html?redirect=edit.html" class="btn-bind-email">📧 绑定邮箱升级会员 →</a>';
  } catch(e) {
    document.getElementById('memberStatusDesc').textContent = '无法获取账号状态';
  }
}

/* ---- 加载个人资料表单 ---- */
async function loadProfileForm() {
  try {
    const user = await UserAPI.me();
    document.getElementById('editSchool').value = user.school || '';
    document.getElementById('editMajor').value = user.major || '';
    document.getElementById('editGrade').value = user.grade || '';
    document.getElementById('editBio').value = user.bio || '';
    document.getElementById('editEmail').value = user.email || '';
  } catch(e) {
    // 从 localStorage 回退
    const u = Auth.getUser();
    if (u) {
      document.getElementById('editSchool').value = u.school || '';
      document.getElementById('editMajor').value = u.major || '';
      document.getElementById('editGrade').value = u.grade || '';
      document.getElementById('editEmail').value = u.email || '';
    }
  }
}

function previewAvatar(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const preview = document.getElementById('avatarPreview');
    preview.innerHTML = '<img src="'+e.target.result+'" style="width:100%;height:100%;object-fit:cover">';
  };
  reader.readAsDataURL(file);
}

async function saveProfile() {
  const btn = document.querySelector('#profileForm .btn-save');
  btn.textContent = '保存中...';
  btn.disabled = true;
  try {
    // 先上传头像
    const avatarFile = document.getElementById('avatarFile').files[0];
    if (avatarFile) {
      try {
        const result = await uploadFile('avatar', avatarFile);
        // 更新预览
        const user = Auth.getUser();
        if (user) { user.avatar_url = result.url; Auth.setUser(user); }
      } catch(e) { console.log('头像上传失败:', e.message); }
    }

    const data = {
      school: document.getElementById('editSchool').value.trim(),
      major: document.getElementById('editMajor').value,
      grade: document.getElementById('editGrade').value,
      bio: document.getElementById('editBio').value.trim(),
      email: document.getElementById('editEmail').value.trim(),
    };
    await UserAPI.updateProfile(data);
    const user = Auth.getUser();
    if (user) { Object.assign(user, data); Auth.setUser(user); }
    showToast('✅ 个人资料已保存', 'success');
  } catch(e) {
    showToast('保存失败：' + e.message, 'error');
  } finally {
    btn.textContent = '💾 保存资料';
    btn.disabled = false;
  }
}

/* ---- 我的发布 ---- */
async function loadMyInternships() {
  const user = Auth.getUser();
  if (!user) return;
  try {
    const data = await UserAPI.internships(user.id);
    myInternshipsData = data.data || data || [];
    renderMyInternships();
  } catch(e) {
    document.getElementById('myInternshipsList').innerHTML =
      '<div class="empty-text"><div class="icon">📋</div><p>加载失败，请确认后端已启动</p></div>';
  }
}

function renderMyInternships() {
  const container = document.getElementById('myInternshipsList');
  if (!myInternshipsData.length) {
    container.innerHTML = '<div class="empty-text"><div class="icon">📋</div><p>你还没有发布过实习信息</p><a href="publish.html" class="btn-save" style="display:inline-block;margin-top:12px;text-decoration:none">📤 去发布</a></div>';
    return;
  }

  container.innerHTML = myInternshipsData.map(item => {
    const colors = ['linear-gradient(135deg,#667eea,#764ba2)','linear-gradient(135deg,#f093fb,#f5576c)','linear-gradient(135deg,#4facfe,#00f2fe)','linear-gradient(135deg,#43e97b,#38f9d7)','linear-gradient(135deg,#fa709a,#fee140)'];
    const bg = colors[item.id % colors.length];
    const salary = item.salary_min ? '¥'+item.salary_min+'-'+item.salary_max+'/天' : '薪资面议';
    const created = new Date(item.created_at).toLocaleString('zh-CN');
    const updated = new Date(item.updated_at).toLocaleString('zh-CN');
    const isModified = item.updated_at && item.created_at &&
      new Date(item.updated_at).getTime() - new Date(item.created_at).getTime() > 1000;

    return `
    <div class="my-internship-card" id="card-${item.id}">
      <div class="my-card-header">
        <div>
          <div class="my-card-title">${escHtml(item.title)}</div>
          <div class="my-card-company">${escHtml(item.company)} · ${escHtml(item.city)} · ${salary}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="status-badge ${item.status==='active'?'status-active':'status-closed'}">${item.status==='active'?'进行中':'已关闭'}</span>
        </div>
      </div>
      <div class="my-card-meta">
        <span>📅 发布：${created}</span>
        ${isModified ? '<span class="modified-badge">✏️ 已编辑 · '+updated+'</span>' : ''}
        <span>👁 ${item.view_count||0} 次查看</span>
        <span>⭐ ${item.favorite_count||0} 人收藏</span>
      </div>
      <div class="my-card-actions">
        <button class="btn-sm btn-edit" onclick="toggleEditForm(${item.id})">✏️ 编辑</button>
        ${item.status==='active' ? `<button class="btn-sm btn-close-intern" onclick="closeInternship(${item.id})">🚫 关闭</button>` : ''}
      </div>
      <div class="inline-edit-form" id="editForm-${item.id}">
        ${buildEditForm(item)}
      </div>
    </div>`;
  }).join('');
}

function buildEditForm(item) {
  const cityOptions = ['北京','上海','广州','深圳','杭州','成都','南京','武汉','西安','苏州','远程办公']
    .map(c => `<option value="${c}" ${item.city===c?'selected':''}>${c}</option>`).join('');

  const eduOptions = ['不限','大专及以上','本科及以上','硕士及以上','博士']
    .map(e => `<option value="${e}" ${item.education===e?'selected':''}>${e}</option>`).join('');

  const daysOptions = [3,4,5].map(d => `<option value="${d}" ${item.days_per_week===d?'selected':''}>${d}天/周</option>`).join('');
  const durOptions = [1,2,3,4,5,6].map(d => `<option value="${d}" ${item.duration_months===d?'selected':''}>${d}个月</option>`).join('');

  return `
    <div class="form-row">
      <div class="form-group"><label>岗位名称</label><input id="et-${item.id}-title" value="${escHtml(item.title||'')}"></div>
      <div class="form-group"><label>公司名称</label><input id="et-${item.id}-company" value="${escHtml(item.company||'')}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>城市</label><select id="et-${item.id}-city">${cityOptions}</select></div>
      <div class="form-group"><label>详细地址</label><input id="et-${item.id}-district" value="${escHtml(item.district||'')}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>薪资下限</label><input type="number" id="et-${item.id}-min" value="${item.salary_min||''}" placeholder="元/天"></div>
      <div class="form-group"><label>薪资上限</label><input type="number" id="et-${item.id}-max" value="${item.salary_max||''}" placeholder="元/天"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>学历要求</label><select id="et-${item.id}-edu">${eduOptions}</select></div>
      <div class="form-group"><label>截止日期</label><input type="date" id="et-${item.id}-deadline" value="${item.deadline||''}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>每周出勤</label><select id="et-${item.id}-days">${daysOptions}</select></div>
      <div class="form-group"><label>实习时长</label><select id="et-${item.id}-dur">${durOptions}</select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>面向专业</label><input id="et-${item.id}-major" value="${escHtml(item.target_major||'')}"></div>
      <div class="form-group"><label>面向年级</label><input id="et-${item.id}-grade" value="${escHtml(item.target_grade||'')}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>招聘人数</label><input type="number" id="et-${item.id}-hc" value="${item.headcount||1}" min="1"></div>
      <div class="form-group"><label>投递邮箱</label><input type="email" id="et-${item.id}-email" value="${escHtml(item.apply_email||'')}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>投递链接</label><input id="et-${item.id}-url" value="${escHtml(item.apply_url||'')}"></div>
      <div class="form-group"><label>是否内推</label><select id="et-${item.id}-refer"><option value="0" ${!item.can_refer?'selected':''}>仅分享信息</option><option value="1" ${item.can_refer?'selected':''}>可以内推</option></select></div>
    </div>
    <div class="form-row single">
      <div class="form-group"><label>职位描述</label><textarea id="et-${item.id}-desc">${escHtml(item.description||'')}</textarea></div>
    </div>
    <div class="form-row single">
      <div class="form-group"><label>任职要求</label><textarea id="et-${item.id}-req">${escHtml(item.requirements||'')}</textarea></div>
    </div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="toggleEditForm(${item.id})">取消</button>
      <button class="btn-save" onclick="saveInternship(${item.id})">💾 保存修改</button>
    </div>`;
}

function toggleEditForm(id) {
  const form = document.getElementById('editForm-' + id);
  form.classList.toggle('show');
}

async function saveInternship(id) {
  const g = (s) => document.getElementById('et-' + id + '-' + s);
  const btn = g('desc').closest('.inline-edit-form').querySelector('.btn-save');
  btn.textContent = '保存中...';
  btn.disabled = true;

  try {
    const data = {
      title: g('title').value.trim(),
      company: g('company').value.trim(),
      city: g('city').value,
      district: g('district').value.trim(),
      job_type: '技术开发',
      salary_min: parseInt(g('min').value) || null,
      salary_max: parseInt(g('max').value) || null,
      education: g('edu').value,
      days_per_week: parseInt(g('days').value) || 4,
      duration_months: parseInt(g('dur').value) || 3,
      deadline: g('deadline').value || null,
      headcount: parseInt(g('hc').value) || 1,
      target_major: g('major').value.trim(),
      target_grade: g('grade').value.trim(),
      description: g('desc').value.trim(),
      requirements: g('req').value.trim(),
      apply_url: g('url').value.trim(),
      apply_email: g('email').value.trim(),
      can_refer: g('refer').value === '1',
    };

    await InternAPI.update(id, data);
    showToast('✅ 修改已保存', 'success');
    // 重新加载列表
    await loadMyInternships();
  } catch(e) {
    showToast('保存失败：' + e.message, 'error');
    btn.textContent = '💾 保存修改';
    btn.disabled = false;
  }
}

async function closeInternship(id) {
  if (!confirm('确定要关闭这条实习信息吗？关闭后其他人将无法查看。')) return;
  try {
    await InternAPI.close(id);
    showToast('实习信息已关闭', 'success');
    await loadMyInternships();
  } catch(e) {
    showToast('操作失败：' + e.message, 'error');
  }
}

/* ---- 工具 ---- */
function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + (type||'success');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 2000);
  setTimeout(() => t.remove(), 2500);
}

function escHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
