<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忘记密码 | 实习通</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-page { min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#eef2ff 0%,#faf5ff 50%,#f0f9ff 100%) }
  .auth-card { background:#fff;border-radius:20px;padding:40px;width:100%;max-width:440px;box-shadow:0 4px 24px rgba(0,0,0,.06),0 20px 60px rgba(79,70,229,.08);position:relative;z-index:1 }
  .auth-logo { text-align:center;margin-bottom:24px }
  .auth-logo a { font-size:28px;font-weight:800;color:#4f46e5;text-decoration:none;letter-spacing:-.5px }
  .auth-logo a span { color:#f59e0b }
  .auth-title { font-size:22px;font-weight:700;color:#1f2937;text-align:center;margin-bottom:6px }
  .auth-subtitle { font-size:14px;color:#9ca3af;text-align:center;margin-bottom:28px }
  .form-group { margin-bottom:18px }
  .form-group label { display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px }
  .form-group input { width:100%;padding:11px 14px;border:2px solid #e5e7eb;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:all .25s;background:#f9fafb }
  .form-group input:focus { border-color:#4f46e5;background:#fff;box-shadow:0 0 0 4px rgba(79,70,229,.08) }
  .code-row { display:flex;gap:10px }
  .code-row input { flex:1 }
  .btn-send { padding:10px 20px;background:#fff;color:#4f46e5;border:2px solid #4f46e5;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s }
  .btn-send:hover { background:#eef2ff }
  .btn-send:disabled { opacity:.5;cursor:not-allowed }
  .btn-submit { width:100%;padding:14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(79,70,229,.25);margin-top:8px }
  .btn-submit:hover { transform:translateY(-1px);box-shadow:0 6px 24px rgba(79,70,229,.35) }
  .btn-submit:disabled { opacity:.5;cursor:not-allowed;transform:none }
  .auth-switch { text-align:center;margin-top:20px;padding-top:20px;border-top:1px solid #f3f4f6;font-size:14px;color:#6b7280 }
  .auth-switch a { color:#4f46e5;font-weight:600;text-decoration:none }
  .auth-error { background:#fef2f2;color:#dc2626;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none }
  .auth-error.show { display:block }
  .auth-success { background:#f0fdf4;color:#065f46;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none }
  .auth-success.show { display:block }
  .step2 { display:none }
  .decor { position:fixed;border-radius:50%;filter:blur(80px);opacity:.15;pointer-events:none;z-index:0 }
  .decor.d1 { width:300px;height:300px;background:#4f46e5;top:-80px;right:-60px }
  .decor.d2 { width:250px;height:250px;background:#f59e0b;bottom:-60px;left:-60px }
  @media (max-width:480px) { .auth-card { padding:28px 20px;border-radius:16px } .code-row { flex-direction:column } }
</style>
</head>
<body>
<div class="decor d1"></div><div class="decor d2"></div>

<div class="auth-page">
<div class="auth-card">
  <div class="auth-logo"><a href="index.html">实习<span>通</span></a></div>
  <h1 class="auth-title">🔑 忘记密码</h1>
  <p class="auth-subtitle">通过注册邮箱重置你的密码</p>

  <div class="auth-error" id="authError"></div>
  <div class="auth-success" id="authSuccess"></div>

  <!-- 第一步：输入用户名和邮箱 -->
  <div id="step1">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="resetUsername" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="form-group">
      <label>注册邮箱</label>
      <input type="email" id="resetEmail" placeholder="请输入注册时填的邮箱" autocomplete="email">
    </div>
    <button class="btn-submit" onclick="sendResetCode()">📧 发送验证码</button>
  </div>

  <!-- 第二步：输入验证码和新密码 -->
  <div id="step2" class="step2">
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="step2Email" readonly style="background:#f3f4f6">
    </div>
    <div class="form-group">
      <label>验证码</label>
      <div class="code-row">
        <input type="text" id="resetCode" placeholder="6位验证码" maxlength="6" inputmode="numeric">
        <button class="btn-send" id="btnResend" onclick="sendResetCode()">重新发送</button>
      </div>
    </div>
    <div class="form-group">
      <label>新密码</label>
      <input type="password" id="newPassword" placeholder="至少6位" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>确认新密码</label>
      <input type="password" id="confirmPassword" placeholder="再次输入新密码">
    </div>
    <button class="btn-submit" onclick="doResetPassword()">✅ 重置密码</button>
  </div>

  <div class="auth-switch">
    <a href="login.html">← 返回登录</a>
  </div>
</div>
</div>

<script src="js/api.js"></script>
<script>
let countdownTimer = null;
let currentEmail = '';

async function sendResetCode() {
  // 忘记密码功能开发中，跳转维护页
  location.href = 'default.html';
}

function startCountdown(s) {
  clearInterval(countdownTimer);
  var btn = document.getElementById('btnResend');
  btn.disabled = true;
  countdownTimer = setInterval(function() {
    s--;
    if (s <= 0) { clearInterval(countdownTimer); btn.textContent = '重新发送'; btn.disabled = false; }
    else { btn.textContent = s + 's 后重发'; }
  }, 1000);
}

async function doResetPassword() {
  // 忘记密码功能开发中，跳转维护页
  location.href = 'default.html';
}

function showError(msg) { var el = document.getElementById('authError'); el.textContent = msg; el.classList.add('show'); document.getElementById('authSuccess').classList.remove('show'); setTimeout(function(){ el.classList.remove('show') }, 4000) }
function showSuccess(msg) { var el = document.getElementById('authSuccess'); el.textContent = msg; el.classList.add('show'); document.getElementById('authError').classList.remove('show') }
</script>
</body>
</html>
