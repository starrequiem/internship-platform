<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绑定邮箱 | 实习通</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .bind-page {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: linear-gradient(135deg, #eef2ff 0%, #faf5ff 50%, #f0f9ff 100%);
  }
  .bind-card {
    background: #fff; border-radius: 20px; padding: 40px; width: 100%; max-width: 460px;
    box-shadow: 0 4px 24px rgba(0,0,0,.06), 0 20px 60px rgba(79,70,229,.08);
    position: relative; z-index: 1;
  }
  .bind-logo { text-align: center; margin-bottom: 24px; }
  .bind-logo a { font-size: 28px; font-weight: 800; color: #4f46e5; text-decoration: none; letter-spacing: -.5px; }
  .bind-logo a span { color: #f59e0b; }
  .bind-title { font-size: 22px; font-weight: 700; color: #1f2937; text-align: center; margin-bottom: 6px; }
  .bind-subtitle { font-size: 14px; color: #9ca3af; text-align: center; margin-bottom: 28px; }
  .bind-info { background: #fefce8; border: 1px solid #fde68a; border-radius: 10px; padding: 14px 16px; font-size: 13px; color: #92400e; margin-bottom: 24px; line-height: 1.6; }
  .bind-info b { color: #92400e; }

  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  .form-group input {
    width: 100%; padding: 11px 14px; border: 2px solid #e5e7eb; border-radius: 10px;
    font-size: 14px; font-family: inherit; outline: none; transition: all .25s; background: #f9fafb;
  }
  .form-group input:focus { border-color: #4f46e5; background: #fff; box-shadow: 0 0 0 4px rgba(79,70,229,.08); }
  .form-group input::placeholder { color: #d1d5db; }
  .form-group .hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }

  /* 快速选取按钮 */
  .quick-email {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px;
    font-size: 13px; color: #065f46; cursor: pointer; transition: all .2s;
    margin-bottom: 18px; width: 100%; font-family: inherit;
  }
  .quick-email:hover { background: #dcfce7; border-color: #86efac; }
  .quick-email .tag { padding: 2px 8px; background: #16a34a; color: #fff; border-radius: 4px; font-size: 11px; font-weight: 600; }

  .code-row { display: flex; gap: 10px; }
  .code-row input { flex: 1; }
  .btn-send {
    padding: 10px 20px; background: #fff; color: #4f46e5; border: 2px solid #4f46e5;
    border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: all .2s; font-family: inherit;
  }
  .btn-send:hover { background: #eef2ff; }
  .btn-send:disabled { opacity: .5; cursor: not-allowed; }
  .btn-send.counting { color: #9ca3af; border-color: #e5e7eb; background: #f9fafb; }

  .btn-bind {
    width: 100%; padding: 14px; margin-top: 8px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff;
    border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: all .25s; font-family: inherit; box-shadow: 0 4px 16px rgba(79,70,229,.25);
  }
  .btn-bind:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(79,70,229,.35); }
  .btn-bind:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .bind-footer { text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #f3f4f6; font-size: 13px; color: #6b7280; }
  .bind-footer a { color: #4f46e5; font-weight: 600; text-decoration: none; }
  .bind-footer a:hover { text-decoration: underline; }

  .bind-error { background: #fef2f2; color: #dc2626; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; }
  .bind-error.show { display: block; }
  .bind-success { background: #f0fdf4; color: #065f46; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; }
  .bind-success.show { display: block; }

  .decor { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .15; pointer-events: none; z-index: 0; }
  .decor.d1 { width: 300px; height: 300px; background: #4f46e5; top: -80px; right: -60px; }
  .decor.d2 { width: 250px; height: 250px; background: #f59e0b; bottom: -60px; left: -60px; }

  @media (max-width:480px) {
    .bind-card { padding: 28px 20px; border-radius: 16px; }
    .bind-title { font-size: 20px; }
    .code-row { flex-direction: column; }
    .btn-send { text-align: center; }
  }
</style>
</head>
<body>

<div class="decor d1"></div>
<div class="decor d2"></div>

<div class="bind-page">
  <div class="bind-card">

    <div class="bind-logo">
      <a href="index.html">实习<span>通</span></a>
    </div>
    <h1 class="bind-title">📧 绑定邮箱</h1>
    <p class="bind-subtitle" id="bindSubtitle">验证邮箱后即可升级为会员，解锁全部功能</p>

    <div class="bind-info">
      💡 <b>会员权益：</b>发布实习信息、发送感谢评论、收藏岗位<br>
      🔒 普通用户只能浏览和搜索，使用会员功能需先绑定邮箱<br>
      ⚠️ 邮箱验证码功能开发中，暂未上线
    </div>

    <div class="bind-error" id="bindError"></div>
    <div class="bind-success" id="bindSuccess"></div>

    <!-- 快速选取注册邮箱 -->
    <button class="quick-email" id="quickEmailBtn" style="display:none" onclick="useRegisteredEmail()">
      📨 <span id="quickEmailText"></span><span class="tag">快速选取</span>
    </button>

    <div class="form-group">
      <label>邮箱地址</label>
      <input type="email" id="bindEmail" placeholder="your@school.edu.cn" autocomplete="email">
      <span class="hint">建议使用学校邮箱（.edu.cn），更方便验证</span>
    </div>

    <div class="form-group">
      <label>验证码</label>
      <div class="code-row">
        <input type="text" id="verifyCode" placeholder="输入6位验证码" maxlength="6" inputmode="numeric">
        <button class="btn-send" id="btnSend" onclick="sendCode()">发送验证码</button>
      </div>
      <span class="hint" id="codeHint"></span>
    </div>

    <button class="btn-bind" id="btnBind" onclick="verifyAndBind()">✅ 验证并绑定</button>

    <div class="bind-footer">
      <a href="profile.html">← 返回个人主页</a>
    </div>

  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
let countdownTimer = null;

(function init() {
  if (!Auth.isLoggedIn()) {
    location.href = 'login.html?redirect=bind-email.html';
    return;
  }

  const user = Auth.getUser();

  // 管理员拥有全部权限，无需绑定邮箱
  if (user && user.role === 'admin') {
    document.getElementById('bindSuccess').textContent = '🛡️ 管理员账号拥有全部权限，无需绑定邮箱';
    document.getElementById('bindSuccess').classList.add('show');
    document.getElementById('btnBind').style.display = 'none';
    document.getElementById('btnSend').style.display = 'none';
    document.querySelectorAll('.form-group').forEach(el => el.style.display = 'none');
    document.getElementById('quickEmailBtn').style.display = 'none';
    return;
  }

  // 检查是否已经是会员
  if (Auth.isMember()) {
    document.getElementById('bindSuccess').textContent = '✅ 您已经是会员，无需再次绑定';
    document.getElementById('bindSuccess').classList.add('show');
    document.getElementById('btnBind').style.display = 'none';
    document.getElementById('btnSend').style.display = 'none';
  }

  // 如果有注册邮箱，显示快速选取
  if (user && user.email && user.email.includes('@')) {
    document.getElementById('quickEmailBtn').style.display = 'flex';
    document.getElementById('quickEmailText').textContent = user.email;
    document.getElementById('bindEmail').value = user.email;
  }
})();

function useRegisteredEmail() {
  const user = Auth.getUser();
  if (user && user.email) {
    document.getElementById('bindEmail').value = user.email;
  }
}

async function sendCode() {
  // 邮箱验证码功能开发中，跳转维护页
  location.href = 'default.html';
}

function startCountdown(seconds) {
  clearInterval(countdownTimer);
  const btn = document.getElementById('btnSend');
  btn.classList.add('counting');

  countdownTimer = setInterval(() => {
    seconds--;
    if (seconds <= 0) {
      clearInterval(countdownTimer);
      btn.textContent = '重新发送';
      btn.disabled = false;
      btn.classList.remove('counting');
      document.getElementById('codeHint').textContent = '';
    } else {
      btn.textContent = seconds + 's 后重发';
    }
  }, 1000);
}

async function verifyAndBind() {
  // 邮箱验证码功能开发中，跳转维护页
  location.href = 'default.html';
}

function showError(msg) {
  const el = document.getElementById('bindError');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('bindSuccess').classList.remove('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}
function showSuccess(msg) {
  const el = document.getElementById('bindSuccess');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('bindError').classList.remove('show');
}
</script>
</body>
</html>
