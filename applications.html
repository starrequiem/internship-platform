<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的投递 | 实习通</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .app-main { max-width:900px;margin:0 auto;padding:24px }
  .app-title { font-size:22px;font-weight:700;color:#1f2937;margin-bottom:8px }
  .app-sub { font-size:13px;color:#9ca3af;margin-bottom:24px }
  .app-card { background:#fff;border-radius:14px;padding:20px 24px;margin-bottom:14px;display:flex;align-items:center;gap:16px;border:1px solid #f3f4f6;transition:all .2s;cursor:pointer }
  .app-card:hover { border-color:#c7d2fe;transform:translateY(-1px) }
  .app-logo { width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0 }
  .app-info { flex:1;min-width:0 }
  .app-info .title { font-size:16px;font-weight:700;color:#1f2937;margin-bottom:4px }
  .app-info .company { font-size:13px;color:#6b7280 }
  .app-salary { font-size:18px;font-weight:800;color:#f59e0b;white-space:nowrap }
  .app-meta { display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0 }
  .status-badge { padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600 }
  .s-clicked { background:#eef2ff;color:#4f46e5 }
  .s-submitted { background:#fef3c7;color:#92400e }
  .s-interview { background:#dbeafe;color:#1e40af }
  .s-offer { background:#d1fae5;color:#065f46 }
  .s-rejected { background:#f3f4f6;color:#6b7280 }
  .app-time { font-size:12px;color:#9ca3af }
  .empty-state { text-align:center;padding:80px 20px }
  .empty-state .icon { font-size:64px;margin-bottom:16px }
  @media (max-width:768px) { .app-card { flex-wrap:wrap } .app-meta { width:100%;flex-direction:row;justify-content:space-between } }
</style>
</head>
<body>
<div data-component="header"></div>

<div class="app-main">
  <h1 class="app-title">📋 我的投递</h1>
  <p class="app-sub">记录你投递过的实习岗位，追踪投递进度</p>
  <div id="appList">
    <div style="text-align:center;padding:40px;color:#9ca3af">加载中...</div>
  </div>
</div>

<script src="js/components.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
const STATUS_MAP = { clicked:'已查看', submitted:'已投递', interview:'面试中', offer:'已录取', rejected:'未通过' };
const STATUS_CLASS = { clicked:'s-clicked', submitted:'s-submitted', interview:'s-interview', offer:'s-offer', rejected:'s-rejected' };
const COLORS = ['linear-gradient(135deg,#667eea,#764ba2)','linear-gradient(135deg,#f093fb,#f5576c)','linear-gradient(135deg,#4facfe,#00f2fe)','linear-gradient(135deg,#43e97b,#38f9d7)','linear-gradient(135deg,#fa709a,#fee140)'];

(async function() {
  if (!Auth.isLoggedIn()) { location.href = 'login.html?redirect=applications.html'; return; }
  try {
    var apps = await AppAPI.list();
    renderApps(apps);
  } catch(e) {
    // 静态演示回退数据
    renderApps([
      { id:1, title:'前端开发实习生', company:'字节跳动', city:'北京', salary_min:400, salary_max:500, status:'submitted', created_at:'2026-07-08T10:30:00' },
      { id:3, title:'Golang后端实习生', company:'腾讯', city:'深圳', salary_min:450, salary_max:550, status:'interview', created_at:'2026-07-05T14:20:00' },
      { id:5, title:'Java后端实习生', company:'华为', city:'深圳', salary_min:400, salary_max:500, status:'clicked', created_at:'2026-07-10T09:00:00' },
    ]);
  }
})();

function renderApps(apps) {
  var container = document.getElementById('appList');
  if (!apps || !apps.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>还没有投递记录</p><a href="index.html" style="color:#4f46e5;font-weight:600;text-decoration:none">去逛逛实习岗位 →</a></div>';
    return;
  }
  container.innerHTML = apps.map(function(a) {
    var bg = COLORS[(a.id||0) % COLORS.length];
    var salary = a.salary_min ? '¥'+a.salary_min+'-'+a.salary_max+'/天' : '薪资面议';
    return '<div class="app-card" onclick="location.href=\'detail.html?id='+(a.internship_id||a.id)+'\'">'+
      '<div class="app-logo" style="background:'+bg+'">'+(a.company||'?').charAt(0)+'</div>'+
      '<div class="app-info"><div class="title">'+escHtml(a.title)+'</div><div class="company">'+escHtml(a.company)+' · '+escHtml(a.city)+'</div></div>'+
      '<div class="app-salary">'+salary+'</div>'+
      '<div class="app-meta"><span class="status-badge '+STATUS_CLASS[a.status]+'">'+STATUS_MAP[a.status]+'</span><span class="app-time">'+timeAgo(new Date(a.created_at))+'</span></div>'+
    '</div>';
  }).join('');
}

function timeAgo(d) { var diff=Date.now()-d.getTime(), m=Math.floor(diff/60000); if(m<1)return'刚刚';if(m<60)return m+'分钟前';var h=Math.floor(m/60);if(h<24)return h+'小时前';var day=Math.floor(h/24);if(day<30)return day+'天前';return Math.floor(day/30)+'个月前' }
function escHtml(s) { if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML }
</script>
</body>
</html>
